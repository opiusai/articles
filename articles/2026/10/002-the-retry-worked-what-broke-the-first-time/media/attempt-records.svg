      <path d="M80 0H0V80" fill="none" stroke="#eaf1fa" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-25%" width="130%" height="155%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0b315f" flood-opacity=".07"/>
    </filter>
  </defs>

