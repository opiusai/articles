  <rect x="1009" y="419" width="52" height="26" rx="13" fill="#eaf4ff"/>
  <text x="1035" y="438" fill="#076cda" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle">A2</text>
  <text x="575" y="486" fill="#09244a" font-family="Consolas,Monaco,monospace" font-size="23" font-weight="600">summary-1842-a1</text>
  <text x="1009" y="486" fill="#09244a" font-family="Consolas,Monaco,monospace" font-size="23" font-weight="600">summary-1842-a2</text>
